
name: Setup Python Environment
description: Install Python and project dependencies using uv

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.11"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: uv sync --frozen --extra dev --extra training --python "${{ inputs.python-version }}"